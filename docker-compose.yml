services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: greenmile
      POSTGRES_USER: greenmile
      POSTGRES_PASSWORD: greenmile
    ports:
      - "5432:5432"
    volumes:
      - greenmile_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenmile -d greenmile"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://greenmile:greenmile@postgres:5432/greenmile
      CORS_ORIGINS: '["http://localhost:3000"]'
      AUTO_SEED_DEMO: "true"
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_TIMEOUT_SECONDS: ${AZURE_OPENAI_TIMEOUT_SECONDS:-20}
      AZURE_OPENAI_MAX_RETRIES: ${AZURE_OPENAI_MAX_RETRIES:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  greenmile_postgres:
